<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #3498db;
            margin-top: 0;
            font-size: 2.5rem;
            text-align: center;
        }
        
        .status-message {
            background-color: #f1f9fe;
            border-left: 4px solid #3498db;
            padding: 12px;
            margin: 20px 0;
            border-radius: 0 5px 5px 0;
            font-weight: 500;
            text-align: center;
        }
        
        .status-message.success {
            background-color: #e7f9eb;
            border-left-color: #27ae60;
        }
        
        .status-message.error {
            background-color: #fee7e7;
            border-left-color: #e74c3c;
        }
        
        .player-selection {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 10px;
            margin: 30px auto;
            max-width: 350px;
        }
        
        .cell {
            aspect-ratio: 1;
            background-color: #ecf0f1;
            border-radius: 8px;
            font-size: 2.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .cell:hover:not(.taken) {
            background-color: #d6eaf8;
            transform: translateY(-2px);
        }
        
        .cell.taken {
            cursor: not-allowed;
        }
        
        .cell.x {
            color: #e74c3c;
        }
        
        .cell.o {
            color: #3498db;
        }
        
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
        
        .btn.secondary {
            background-color: #ecf0f1;
            color: #333;
        }
        
        .btn.secondary:hover {
            background-color: #bdc3c7;
        }
        
        .btn.accent {
            background-color: #e74c3c;
        }
        
        .btn.accent:hover {
            background-color: #c0392b;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        
        .winner-message {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            background-color: #e7f9eb;
            color: #27ae60;
        }
        
        .draw-message {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            background-color: #f7f9fa;
            color: #7f8c8d;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tic-Tac-Toe</h1>
        
        <div id="player-selection" class="player-selection">
            <button class="btn" onclick="choosePlayer('X')">Play as X</button>
            <button class="btn secondary" onclick="choosePlayer('O')">Play as O</button>
        </div>
        
        <div id="status" class="status-message">Choose your player to start</div>
        
        <div id="winner-display" class="winner-message hidden"></div>
        
        <div class="board" id="board"></div>
        
        <div class="controls">
            <button class="btn accent" onclick="restartGame()">Restart Game</button>
        </div>
    </div>

    <script>
        let user = null;
        let board = [[null, null, null], [null, null, null], [null, null, null]];
        let gameOver = false;
        let winner = null;
        
        // Initialize the game
        function init() {
            fetch('/game_state')
                .then(res => res.json())
                .then(data => {
                    if (data.user) {
                        user = data.user;
                        board = data.board;
                        gameOver = data.game_over;
                        winner = data.winner;
                        updateStatus();
                        renderBoard();
                    } else {
                        renderBoard();
                    }
                });
        }

        function renderBoard() {
            const boardDiv = document.getElementById("board");
            boardDiv.innerHTML = "";
            
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    const cell = document.createElement("div");
                    cell.className = "cell";
                    
                    if (board[i][j]) {
                        cell.textContent = board[i][j];
                        cell.classList.add("taken");
                        cell.classList.add(board[i][j].toLowerCase());
                    } else if (!gameOver && user) {
                        cell.onclick = () => makeMove(i, j);
                    }
                    
                    boardDiv.appendChild(cell);
                }
            }
            
            // Show or hide UI elements based on game state
            document.getElementById("player-selection").style.display = !user ? "flex" : "none";
            
            // Update winner display
            const winnerDisplay = document.getElementById("winner-display");
            if (gameOver) {
                if (winner) {
                    winnerDisplay.textContent = `${winner} wins the game!`;
                    winnerDisplay.className = "winner-message";
                } else {
                    winnerDisplay.textContent = "It's a draw!";
                    winnerDisplay.className = "draw-message";
                }
                winnerDisplay.classList.remove("hidden");
            } else {
                winnerDisplay.classList.add("hidden");
            }
        }

        function updateStatus() {
            const statusElement = document.getElementById("status");
            
            if (!user) {
                statusElement.textContent = "Choose your player to start";
                statusElement.className = "status-message";
            } else if (gameOver) {
                if (winner) {
                    statusElement.textContent = `Game over: ${winner} wins!`;
                    statusElement.className = "status-message success";
                } else {
                    statusElement.textContent = "Game over: It's a draw!";
                    statusElement.className = "status-message";
                }
            } else {
                statusElement.textContent = `You are playing as ${user}`;
                statusElement.className = "status-message";
            }
        }

        function choosePlayer(player) {
            fetch("/choose", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ player })
            })
            .then(res => res.json())
            .then(data => {
                user = data.user;
                board = data.board;
                gameOver = false;
                winner = null;
                
                updateStatus();
                renderBoard();
            });
        }

        function makeMove(row, col) {
            if (!user || gameOver) return;
            
            fetch("/move", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ row, col })
            })
            .then(res => {
                if (!res.ok) {
                    throw new Error("Invalid move");
                }
                return res.json();
            })
            .then(data => {
                board = data.board;
                gameOver = data.game_over;
                winner = data.winner;
                
                updateStatus();
                renderBoard();
                
                // Make AI move if game is not over
                if (!gameOver) {
                    setTimeout(aiMove, 500); // Add a small delay for better UX
                }
            })
            .catch(error => {
                console.error("Error:", error);
            });
        }

        function aiMove() {
            if (!user || gameOver) return;
            
            fetch("/ai_move", { method: "POST" })
            .then(res => {
                if (!res.ok) {
                    return res.json().then(data => {
                        throw new Error(data.message || "AI move failed");
                    });
                }
                return res.json();
            })
            .then(data => {
                board = data.board;
                gameOver = data.game_over;
                winner = data.winner;
                
                updateStatus();
                renderBoard();
            })
            .catch(error => {
                console.error("Error:", error);
            });
        }

        function restartGame() {
            fetch("/restart", { method: "POST" })
            .then(res => res.json())
            .then(() => {
                user = null;
                board = [[null, null, null], [null, null, null], [null, null, null]];
                gameOver = false;
                winner = null;
                
                updateStatus();
                renderBoard();
            });
        }

        // Initialize the game
        init();
    </script>
</body>
</html>
